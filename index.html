<style>

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

.tt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.bar{height:8px;border-radius:99px;background:var(--sub);overflow:hidden;margin-top:8px;width:100%}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

main{max-width:760px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:12px;overflow:hidden}
.pad{padding:14px 16px}

.mu{color:var(--mu);font-size:.88rem}

.wp{flex:none;font-size:.82rem;font-weight:700;color:var(--ok)}

.big{font-size:2.2rem;font-weight:800}

ound-color: var(--bg-card-learned);\n      border-color: var(--border-learned);\n      box-shadow: var(--shadow-card);\n    }\n    .surface-subtle {\n      background-color: var(--bg-subtle);\n      border-color: var(--border-color);\n    }\n    .text-main {\n      color: var(--text-primary);\n    }\n    .text-sub {\n      color: var(--text-secondary);\n    }\n    .text-dim {\n      color: var(--text-muted);\n    }\n\n    /* Плавное раскрытие аккордеона карточек через CSS grid-rows */\n    .accordion-content {\n      display: grid;\n      grid-template-rows: 0fr;\n      transition: grid-template-rows 0.26s cubic-bezier(0.22, 1, 0.36, 1);\n    }\n    .accordion-item.is-open .accordion-content {\n      grid-template-rows: 1fr;\n    }\n    .accordion-inner {\n      overflow: hidden;\n    }\n    .accordion-chevron {\n      transition: transform 0.22s ease;\n    }\n    .accordion-item.is-open .accordion-chevron {\n      transform: rotate(180deg);\n    }\n\n    /* Скрытие горизонтального скроллбара для вкладок на смартфоне */\n    .no-scrollbar::-webkit-scrollbar {\n      display: none;\n    }\n    .no-scrollbar {\n      -ms-overflow-style: none;\n      scrollbar-width: none;\n    }\n\n    /* Подсветка поискового совпадения */\n    mark.search-hit {\n      background-color: var(--mark-bg);\n      color: var(--mark-text);\n      border-radius: 0.25rem;\n      padding: 0 0.2rem;\n    }\n  <\/style>\n<\/head>\n<body class=\"min-h-screen antialiased\">\n  <\!-- Липкая шапка с переключателем темы, прогрессом и фильтрами -->\n  <header class=\"surface-header sticky top-0 z-30 border-b backdrop-blur-md\">\n    <div class=\"mx-auto max-w-4xl px-4 py-4 sm:px-6\">\n      <\!-- Верхний ряд: заголовок + переключатель тем -->\n      <div class=\"flex flex-wrap items-start justify-between gap-3\">\n        <div class=\"min-w-0\">\n          <div class=\"flex flex-wrap items-center gap-2\">\n            <span\n              class=\"inline-flex items-center rounded-lg px-2.5 py-0.5 text-xs font-semibold\"\n              style=\"background-color: var(--accent-soft); color: var(--accent-primary);\"\n            >\n              ЕНТ • Русская литература\n            <\/span>\n            <span class=\"text-xs font-medium text-dim\" id=\"totalCountLabel\">Загрузка...<\/span>\n          <\/div>\n          <h1 class=\"mt-1.5 text-xl font-bold tracking-tight text-main sm:text-2xl\">\n            Справочник тропов и сложных приёмов\n          <\/h1>\n        <\/div>\n\n        <\!-- Переключатель темы: Книга (светлая) / Графит (мягкая тёмная) -->\n        <div\n          role=\"group\"\n          aria-label=\"Выбор цветовой темы\"\n          class=\"surface-subtle inline-flex rounded-xl border p-1\"\n        >\n          <button\n            id=\"themeLightBtn\"\n            type=\"button\"\n            class=\"inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition\"\n          >\n            <svg class=\"h-3.5 w-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n              <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z\" />\n            <\/svg>\n            <span>Книга<\/span>\n          <\/button>\n          <button\n            id=\"themeDarkBtn\"\n            type=\"button\"\n            class=\"inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition\"\n          >\n            <svg class=\"h-3.5 w-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\n              <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z\" />\n            <\/svg>\n            <span>Графит<\/span>\n          <\/button>\n        <\/div>\n      <\/div>\n\n      <\!-- Компактная полоса прогресса -->\n      <div class=\"surface-card mt-3.5 rounded-xl border px-3.5 py-2.5\">\n        <div class=\"flex items-center justify-between text-xs sm:text-sm\">\n          <span class=\"font-medium text-sub\">Прогресс изучения<\/span>\n          <span class=\"font-semibold\" style=\"color: var(--success-text);\" id=\"progressStats\">0 / 0 (0%)<\/span>\n        <\/div>\n        <div class=\"mt-2 h-2 w-full overflow-hidden rounded-full\" style=\"background-color: var(--bg-subtle);\">\n          <div\n            id=\"progressBarFill\"\n            class=\"h-full rounded-full transition-all duration-300\"\n            style=\"width: 0%; background-color: var(--accent-primary);\"\n          ><\/div>\n        <\/div>\n      <\/div>\n\n      <\!-- Поиск и действия -->\n      <div class=\"mt-3 flex flex-col gap-2.5 sm:flex-row sm:items-center\">\n        <div class=\"relative flex-1\">\n          <svg\n            class=\"pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-dim\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            stroke-width=\"2\"\n            viewBox=\"0 0 24 24\"\n            aria-hidden=\"true\"\n          >\n            <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z\" />\n          <\/svg>\n          <input\n            id=\"searchInput\"\n            type=\"search\"\n            placeholder=\"Поиск: метафора, синекдоха, творительный падеж, пример...\"\n            class=\"surface-card w-full rounded-xl border py-2.5 pl-10 pr-10 text-sm sm:text-base text-main outline-none transition focus:ring-2\"\n            style=\"--tw-ring-color: var(--accent-primary);\"\n          />\n          <button\n            id=\"clearSearchBtn\"\n            type=\"button\"\n            title=\"Очистить поиск\"\n            class=\"hidden absolute right-2.5 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-dim hover:opacity-80\"\n          >\n            <svg class=\"h-4 w-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n              <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6 18L18 6M6 6l12 12\" />\n            <\/svg>\n          <\/button>\n        <\/div>\n\n        <div class=\"flex items-center gap-2\">\n          <button\n            id=\"toggleAllBtn\"\n            type=\"button\"\n            class=\"surface-card flex-1 sm:flex-none rounded-xl border px-3.5 py-2.5 text-xs sm:text-sm font-medium text-main transition active:scale-[0.99]\"\n          >\n            Развернуть все\n          <\/button>\n          <button\n            id=\"resetProgressBtn\"\n            type=\"button\"\n            title=\"Сбросить отметки об изучении\"\n            class=\"surface-card rounded-xl border px-3.5 py-2.5 text-xs sm:text-sm font-medium text-sub transition active:scale-[0.99]\"\n          >\n            Сброс\n          <\/button>\n        <\/div>\n      <\/div>\n\n      <\!-- Вкладки фильтрации -->\n      <nav\n        aria-label=\"Категории тропов\"\n        id=\"categoryTabs\"\n        class=\"no-scrollbar -mx-4 mt-3 flex gap-2 overflow-x-auto px-4 pb-1 sm:mx-0 sm:flex-wrap sm:overflow-visible sm:px-0\"\n      ><\/nav>\n    <\/div>\n  <\/header>\n\n  <\!-- Основная рабочая область -->\n  <main class=\"mx-auto max-w-4xl px-4 py-6 sm:px-6\">\n    <\!-- Короткая памятка -->\n    <section\n      aria-label=\"Как пользоваться справочником\"\n      class=\"surface-subtle mb-5 flex flex-col gap-2 rounded-2xl border px-4 py-3.5 sm:flex-row sm:items-center sm:justify-between\"\n    >\n      <p class=\"text-sm text-sub\">\n        <span class=\"font-semibold text-main\">Совет:<\/span>\n        читайте формулу-правило, проверяйте ключевые слова в примерах и обязательно сверяйте блок\n        <span class=\"font-semibold\" style=\"color: var(--accent-amber);\">«Как не перепутать на ЕНТ»<\/span>.\n      <\/p>\n      <span\n        id=\"visibleCountBadge\"\n        class=\"surface-card shrink-0 self-start sm:self-center rounded-lg border px-2.5 py-1 text-xs font-semibold text-sub\"\n      >\n        Показано: 0\n      <\/span>\n    <\/section>\n\n    <\!-- Список карточек -->\n    <div id=\"tropesList\" class=\"space-y-4\"><\/div>\n\n    <\!-- Состояние пустого результата -->\n    <div\n      id=\"emptyState\"\n      class=\"surface-card hidden rounded-2xl border border-dashed px-6 py-12 text-center\"\n    >\n      <p class=\"text-base font-semibold text-main\">По вашему запросу ничего не найдено<\/p>\n      <p class=\"mt-1 text-sm text-sub\">\n        Попробуйте другое слово или вернитесь ко всем категориям.\n      <\/p>\n      <button\n        id=\"resetFiltersBtn\"\n        type=\"button\"\n        class=\"mt-4 rounded-xl px-4 py-2.5 text-sm font-semibold text-white transition\"\n        style=\"background-color: var(--accent-primary);\"\n      >\n        Показать все тропы\n      <\/button>\n    <\/div>\n\n    <\!-- Всплывающее уведомление (без alert/confirm) -->\n    <div\n      id=\"toastBanner\"\n      role=\"status\"\n      aria-live=\"polite\"\n      class=\"pointer-events-none fixed bottom-5 left-1/2 z-50 -translate-x-1/2 translate-y-4 opacity-0 transition-all duration-200\"\n    >\n      <div class=\"surface-card flex items-center gap-3 rounded-xl border px-4 py-3 text-sm text-main shadow-lg\">\n        <span id=\"toastText\">Прогресс сброшен<\/span>\n        <button\n          id=\"toastUndoBtn\"\n          type=\"button\"\n          class=\"pointer-events-auto hidden rounded-lg px-2.5 py-1 text-xs font-semibold\"\n          style=\"background-color: var(--accent-soft); color: var(--accent-primary);\"\n        >\n          Вернуть\n        <\/button>\n      <\/div>\n    <\/div>\n  <\/main>\n\n  <\script>\n    /**\n     * Полная база тропов для подготовки к ЕНТ по русской литературе:\n     * - Эпитет (художественный, постоянный/фольклорный, метафорический)\n     * - Сравнение (союзное, бессоюзное в творительном падеже, отрицательное)\n     * - Метафора (простая, развёрнутая, олицетворение)\n     * - Метонимия, синекдоха\n     * - Гипербола, литота\n     * - Перифраз, эвфемизм\n     * - Аллегория, ирония, сарказм, оксюморон, синестезия, антономазия\n     */\n    const TROPES_DATA = [\n      // ================= ЭПИТЕТЫ =================\n      {\n        id: 'epithet-artistic',\n        title: 'Художественный эпитет',\n        category: 'Эпитеты',\n        badgeType: 'Базовый',\n        formula: 'Образное определение (обычно прилагательное), передающее эмоцию, настроение или оценку автора, а не сухой факт.',\n        explanation: 'Обычное определение просто называет реальное свойство («деревянный стол», «холодный ветер»). Художественный эпитет переосмысливает признак, создавая картину и отношение («свинцовые тучи» — тяжёлые, мрачные, грозовые).',\n        examples: [\n          {\n            text: 'Над городом повисло тяжёлое свинцовое небо.',\n            highlight: 'свинцовое',\n            note: 'Тучи не из металла — слово передаёт тёмный цвет и давящую тяжесть перед бурей.'\n          },\n          {\n            text: '«И равнодушная природа красою вечною сиять» (А. С. Пушкин, «Брожу ли я вдоль улиц шумных…»).',\n            highlight: 'равнодушная',\n            note: 'Выразительный поэтический признак: природа безразлична к человеческой судьбе, её красота вечна.'\n          }\n        ],\n        entTrap: 'Не путайте художественный эпитет с обычным логическим определением: «высокое дерево», «красный флаг», «сладкий пирог» — это прямые признаки предметов, а не троп.'\n      },\n      {\n        id: 'epithet-folklore',\n        title: 'Постоянный (фольклорный) эпитет',\n        category: 'Эпитеты',\n        badgeType: 'Смежный',\n        formula: 'Устойчивое определение из былин, сказок и народных песен, которое закреплено за конкретным словом.',\n        explanation: 'В устном народном творчестве такие пары слов переходят из произведения в произведение как готовые поэтические формулы, помогая сказителю держать ритм и сразу погружать слушателя в мир эпоса.',\n        examples: [\n          {\n            text: 'Выехал добрый молодец в чисто поле на резвом коне.',\n            highlight: 'добрый молодец, чисто поле, резвом коне',\n            note: 'Классическая фольклорная триада устойчивых определений.'\n          },\n          {\n            text: 'Красная девица смотрела на сине море.',\n            highlight: 'Красная девица, сине море',\n            note: 'Традиционные народно-поэтические сочетания.'\n          }\n        ],\n        entTrap: 'Авторские красивые образы («сиреневые сумерки», «стеклянный взгляд») не относятся к постоянным эпитетам — постоянный эпитет всегда связан с фольклорной традицией.'\n      },\n      {\n        id: 'epithet-metaphorical',\n        title: 'Метафорический эпитет',\n        category: 'Эпитеты',\n        badgeType: 'Тонкий',\n        formula: 'Эпитет, в основе которого лежит скрытое сравнение (перенос свойства одного предмета на другой).',\n        explanation: 'Такое определение сжимает целую метафору до одного прилагательного: физическое свойство материала или температуры («ледяной», «каменный», «золотой») переносится на поведение или характер.',\n        examples: [\n          {\n            text: 'От его ледяной вежливости всем стало не по себе.',\n            highlight: 'ледяной',\n            note: 'Свойство льда перенесено на холодную, отчуждённую манеру общения.'\n          },\n          {\n            text: 'У него было поистине каменное сердце.',\n            highlight: 'каменное',\n            note: 'Твёрдость и бесчувственность камня перенесены на душевную чёрствость.'\n          }\n        ],\n        entTrap: 'Если в тесте среди вариантов есть уточнение «метафорический эпитет» и видно явный перенос свойства с неживого материала/стихии на чувство или поступок — выбирайте его.'\n      },\n\n      // ================= СРАВНЕНИЯ =================\n      {\n        id: 'comparison-conjunction',\n        title: 'Сравнение (союзное)',\n        category: 'Сравнения',\n        badgeType: 'Базовый',\n        formula: 'Прямое сопоставление двух предметов или явлений с помощью союзов «как», «словно», «будто», «точно», «как будто».',\n        explanation: 'В сравнении всегда названы ОБА объекта — и то, что сравнивают, и то, с чем сравнивают, — а между ними стоит явный сравнительный союз или оборот.',\n        examples: [\n          {\n            text: 'Облака плыли по небу, как белые лебеди.',\n            highlight: 'как белые лебеди',\n            note: 'Названы оба предмета («облака» и «лебеди»), связаны союзом «как».'\n          },\n          {\n            text: 'Лес, точно терем расписной, лиловый, золотой, багряный... (И. А. Бунин).',\n            highlight: 'точно терем расписной',\n            note: 'Осенний лес прямо сопоставляется с теремом через союз «точно».'\n          }\n        ],\n        entTrap: 'Сравнение vs Метафора: если есть сравнительный союз «как / словно / точно / будто» и два предмета сопоставлены по сходству — это сравнение. Если союза нет и один предмет назван вместо другого («белые лебеди плыли над городом» вместо облаков) — это метафора. Осторожно: «как» бывает и не сравнительным («знаю, как это делается»).'\n      },\n      {\n        id: 'comparison-instrumental',\n        title: 'Сравнение в творительном падеже (бессоюзное)',\n        category: 'Сравнения',\n        badgeType: 'Ловушка ЕНТ',\n        formula: 'Существительное в творительном падеже («кем? чем?») уподобляет одно действие или предмет другому без союза «как».',\n        explanation: 'Отсутствие союза делает фразу быстрой и сжатой, но по смыслу слово в творительном падеже легко разворачивается в оборот «как кто / как что».',\n        examples: [\n          {\n            text: 'Ястребом взмыл самолёт в высокое утреннее небо.',\n            highlight: 'Ястребом',\n            note: '«Ястребом» (Т. п.) = как ястреб. Сравнивается стремительный полёт самолёта и птицы.'\n          },\n          {\n            text: 'Густой туман стелился над рекой белым дымом.',\n            highlight: 'белым дымом',\n            note: 'Творительный падеж передаёт сходство по виду и движению.'\n          }\n        ],\n        entTrap: 'Частая ловушка! Ученики часто путают этот приём с метафорой, потому что нет союза «как». Проверяйте вопрос «кем? чем?»: если оба предмета на месте («самолёт» + «ястребом») — это сравнение в творительном падеже.'\n      },\n      {\n        id: 'comparison-negative',\n        title: 'Отрицательное сравнение',\n        category: 'Сравнения',\n        badgeType: 'Тонкий',\n        formula: 'Сопоставление через отрицание («не А, а Б»): сначала называется образ, затем он отрицается и раскрывается реальное явление.',\n        explanation: 'Приём пришёл из народной поэзии и былин: он создаёт интригу, позволяя читателю увидеть двойную картину — и образ-сравнение, и сам предмет.',\n        examples: [\n          {\n            text: 'Не ветер бушует над бором, не с гор побежали ручьи — Мороз-воевода дозором обходит владенья свои (Н. А. Некрасов).',\n            highlight: 'Не ветер... не с гор побежали ручьи — Мороз-воевода',\n            note: 'Картина природы сначала подаётся через отрицание, затем раскрывается главный образ.'\n          },\n          {\n            text: 'То не белая берёза к земле клонится — то красна девица печалится.',\n            highlight: 'То не белая берёза... то красна девица',\n            note: 'Фольклорный параллелизм в форме отрицательного сравнения.'\n          }\n        ],\n        entTrap: 'Не путайте с антитезой: в антитезе противопоставляются два реальных разных явления («день и ночь»), а в отрицательном сравнении первый образ лишь помогает ярче описать второй.'\n      },\n\n      // ================= МЕТАФОРА И ОБРАЗЫ =================\n      {\n        id: 'metaphor-simple',\n        title: 'Метафора',\n        category: 'Метафора и образы',\n        badgeType: 'Базовый',\n        formula: 'Скрытое сравнение на основе сходства признаков, без союзов «как», «словно», «точно».',\n        explanation: 'Одно явление называется именем другого или описывается через его действия, потому что между ними есть внутреннее, визуальное или эмоциональное сходство.',\n        examples: [\n          {\n            text: 'В душе погасла последняя искра надежды.',\n            highlight: 'погасла последняя искра надежды',\n            note: 'Надежда уподоблена тлеющему огоньку.'\n          },\n          {\n            text: 'Стальной ястреб стремительно разрезал облака.',\n            highlight: 'Стальной ястреб',\n            note: 'Самолёт прямо назван «стальным ястребом» без сравнительного союза.'\n          }\n        ],\n        entTrap: 'Сравните два примера: «Ястребом взмыл самолёт» (сравнение в Т. п. — названы оба слова) vs «Стальной ястреб разрезал облака» (метафора — слово «самолёт» полностью заменено образом).'\n      },\n      {\n        id: 'metaphor-extended',\n        title: 'Развёрнутая метафора',\n        category: 'Метафора и образы',\n        badgeType: 'Смежный',\n        formula: 'Цепочка взаимосвязанных метафор, которые развивают один общий образ на протяжении фразы, строфы или всего текста.',\n        explanation: 'Вместо одного переносного слова автор выстраивает целую картину, где каждая новая деталь продолжает исходную метафорическую логику.',\n        examples: [\n          {\n            text: 'Осень тихо вошла в сад, рассыпала по дорожкам медные монеты листьев и зажгла багряные костры рябин.',\n            highlight: 'медные монеты листьев... багряные костры рябин',\n            note: 'Все образы работают на единую картину щедрой золотой осени.'\n          }\n        ],\n        entTrap: 'Если в вопросе ЕНТ дано длинное предложение или строфа, где один метафорический образ распадается на несколько связанных деталей — выбирайте «развёрнутая метафора».'\n      },\n      {\n        id: 'personification',\n        title: 'Олицетворение',\n        category: 'Метафора и образы',\n        badgeType: 'Базовый',\n        formula: 'Наделение неживых предметов, природы или отвлечённых понятий свойствами, чувствами и действиями живого существа.',\n        explanation: 'Олицетворение «оживляет» мир: ветер начинает сердиться, лес — дремать, небо — хмуриться. Это помогает передать настроение сцены через окружающую среду.',\n        examples: [\n          {\n            text: 'Дремлет лес под сказку сна (С. А. Есенин, «Пороша»).',\n            highlight: 'Дремлет лес',\n            note: 'Лесу приписано состояние сна, свойственное живому существу.'\n          },\n          {\n            text: 'Небо нахмурилось перед приближающейся грозой.',\n            highlight: 'Небо нахмурилось',\n            note: 'Человеческая мимика перенесена на состояние неба.'\n          }\n        ],\n        entTrap: 'Олицетворение — разновидность метафоры, но если природа или неживой предмет «ведёт себя» как живое существо (дремлет, хмурится), точный ответ — «олицетворение», а не просто «метафора».'\n      },\n      {\n        id: 'allegory',\n        title: 'Аллегория',\n        category: 'Метафора и образы',\n        badgeType: 'Базовый',\n        formula: 'Иносказательное изображение отвлечённого качества или идеи через конкретный персонаж, животное или предмет.',\n        explanation: 'Аллегория чаще всего встречается в баснях, притчах и сказках: за образом животного или вещи скрывается понятный тип человеческого поведения.',\n        examples: [\n          {\n            text: 'В баснях И. А. Крылова лиса воплощает хитрость и лесть, осёл — упрямство, ягнёнок — беззащитность.',\n            highlight: 'лиса — хитрость, осёл — упрямство',\n            note: 'Конкретный образ однозначно соотносится с человеческим пороком или качеством.'\n          }\n        ],\n        entTrap: 'Аллегория vs Символ: аллегория имеет чёткую, почти однозначную расшифровку (фемида с весами = правосудие), тогда как символ многозначен и глубже связан с сюжетом («вишнёвый сад» у Чехова).'\n      },\n      {\n        id: 'synesthesia',\n        title: 'Синестезия',\n        category: 'Метафора и образы',\n        badgeType: 'Тонкий',\n        formula: 'Смешение в одном образе ощущений от разных органов чувств (слух + осязание, зрение + звук, вкус + цвет).',\n        explanation: 'Обычное определение описывает одно чувство («громкий стук» — только слух). Синестезия соединяет две разные сенсорные сферы, делая образ объёмным.',\n        examples: [\n          {\n            text: 'Бархатный голос певца заполнил весь концертный зал.',\n            highlight: 'Бархатный голос',\n            note: 'Голос (слух) описывается через ощущение мягкой ткани (осязание).'\n          },\n          {\n            text: 'Холодные звуки флейты / кричащий цвет.',\n            highlight: 'Холодные звуки, кричащий цвет',\n            note: 'Пересечение температуры/звука и слуха/зрения.'\n          }\n        ],\n        entTrap: 'Проверяйте, сколько органов чувств задействовано: «сладкий пирог» (один вкус) — не синестезия, а «сладкая мелодия» (вкус + слух) — синестезия.'\n      },\n\n      // ================= ПЕРЕНОС ПО СВЯЗИ И ПЕРИФРАЗЫ =================\n      {\n        id: 'metonymy',\n        title: 'Метонимия',\n        category: 'Перенос по связи',\n        badgeType: 'Базовый',\n        formula: 'Перенос названия с одного предмета на другой по их реальной, физической или логической смежности (автор → книга, сосуд → содержимое, место → люди).',\n        explanation: 'В отличие от метафоры, здесь предметы не «похожи» друг на друга — они связаны в реальной жизни: мы читаем книги Пушкина, пьём чай из чашки, слушаем людей в аудитории.',\n        examples: [\n          {\n            text: 'На верхней полке стоял потёртый томик Пушкина.',\n            highlight: 'томик Пушкина',\n            note: 'Имя автора обозначает книгу с его произведениями.'\n          },\n          {\n            text: 'Вся аудитория напряжённо замерла в ожидании результатов.',\n            highlight: 'Вся аудитория',\n            note: 'Название помещения заменяет людей, которые в нём находятся.'\n          }\n        ],\n        entTrap: 'Метонимия vs Метафора: «золотая голова» (сходство по ценности/уму — метафора) vs «съесть две тарелки» (связь сосуда и еды — метонимия).'\n      },\n      {\n        id: 'synecdoche',\n        title: 'Синекдоха',\n        category: 'Перенос по связи',\n        badgeType: 'Ловушка ЕНТ',\n        formula: 'Разновидность метонимии: название части заменяет целое (или наоборот), либо единственное число употреблено вместо множественного.',\n        explanation: 'Выделяя одну характерную деталь («лишний рот», «француз», «все флаги»), автор концентрирует внимание читателя на главном признаке.',\n        examples: [\n          {\n            text: '«И слышно было до рассвета, как ликовал француз» (М. Ю. Лермонтов, «Бородино»).',\n            highlight: 'ликовал француз',\n            note: 'Единственное число («француз») обозначает всю французскую армию.'\n          },\n          {\n            text: 'В доме нашем каждый лишний рот на счету.',\n            highlight: 'лишний рот',\n            note: 'Часть тела («рот») обозначает целого человека (едока).'\n          }\n        ],\n        entTrap: 'Синекдоху лучше проверять отдельно от метонимии: видите схему «часть ↔ целое» или «один ↔ много» — это синекдоха.'\n      },\n      {\n        id: 'periphrasis',\n        title: 'Перифраз (перифраза)',\n        category: 'Перенос по связи',\n        badgeType: 'Смежный',\n        formula: 'Описательный оборот из нескольких слов, заменяющий прямое название предмета, человека или города по его характерному признаку.',\n        explanation: 'Перифраз помогает избежать повторов в тексте, сделать речь торжественной или образной, подчеркнув главную черту объекта.',\n        examples: [\n          {\n            text: 'Ночное светило осветило тихую реку.',\n            highlight: 'Ночное светило',\n            note: 'Описательная замена слова «Луна».'\n          },\n          {\n            text: 'Царь зверей неторопливо вышел из зарослей.',\n            highlight: 'Царь зверей',\n            note: 'Устойчивый перифраз вместо слова «лев».'\n          }\n        ],\n        entTrap: 'Если одно конкретное слово заменено устойчивым описанием из 2–3 слов («город на Неве», «солнце русской поэзии») — это перифраз.'\n      },\n      {\n        id: 'euphemism',\n        title: 'Эвфемизм',\n        category: 'Перенос по связи',\n        badgeType: 'Тонкий',\n        formula: 'Смягчающий, деликатный или возвышенный оборот речи, заменяющий слово, которое звучит слишком грубо, мрачно или пугающе.',\n        explanation: 'Эвфемизм — это особый вид перифраза, задача которого — сгладить острый угол, проявить такт или придать печальному событию спокойный тон.',\n        examples: [\n          {\n            text: 'Старый мастер тихо ушёл на вечный покой.',\n            highlight: 'ушёл на вечный покой',\n            note: 'Смягчающая замена прямого слова «умер».'\n          },\n          {\n            text: 'Он человек весьма почтенного возраста / сказал неправду.',\n            highlight: 'почтенного возраста / сказал неправду',\n            note: 'Деликатная замена слов «старый» и «соврал».'\n          }\n        ],\n        entTrap: 'Различайте нейтральный/поэтический перифраз («ночное светило» = Луна) и эвфемизм, который всегда смягчает неприятное, грубое или трагическое понятие.'\n      },\n      {\n        id: 'antonomasia',\n        title: 'Антономазия',\n        category: 'Перенос по связи',\n        badgeType: 'Тонкий',\n        formula: 'Употребление имени собственного (литературного героя, исторического лица) в значении нарицательного — для обозначения целого типа людей.',\n        explanation: 'Одно известное имя заменяет длинное описание характера: сказав «Хлестаков» или «Плюшкин», мы сразу передаём целый набор качеств.',\n        examples: [\n          {\n            text: 'В каждом уездном городе обязательно найдётся свой Хлестаков.',\n            highlight: 'свой Хлестаков',\n            note: 'Имя героя комедии Н. В. Гоголя обозначает любого безудержного хвастуна.'\n          },\n          {\n            text: 'Настоящий Отелло / современный Дон Кихот.',\n            highlight: 'Отелло, Дон Кихот',\n            note: 'Имена собственные стали нарицательными обозначениями ревнивца и благородного мечтателя.'\n          }\n        ],\n        entTrap: 'Антономазия vs Метонимия: «читать Гоголя» (метонимия — книги писателя) vs «он настоящий Манилов» (антономазия — человек с характером героя).'\n      },\n\n      // ================= КОНТРАСТ, ИРОНИЯ И МАСШТАБ =================\n      {\n        id: 'oxymoron',\n        title: 'Оксюморон',\n        category: 'Контраст и ирония',\n        badgeType: 'Ловушка ЕНТ',\n        formula: 'Соединение в одном словосочетании двух логически несовместимых, взаимоисключающих понятий, рождающее новый парадоксальный смысл.',\n        explanation: 'Сталкивая противоположности («красноречивое» + «молчание»), автор показывает сложную, противоречивую правду жизни, которую нельзя передать обычным словом.',\n        examples: [\n          {\n            text: 'Красноречивое молчание затянулось на несколько минут.',\n            highlight: 'Красноречивое молчание',\n            note: 'Молчание по смыслу исключает речь, но здесь оно говорит само за себя.'\n          },\n          {\n            text: '«Живой труп» (Л. Н. Толстой), «горячий снег», «звонкая тишина».',\n            highlight: 'Живой труп, горячий снег, звонкая тишина',\n            note: 'Классические парадоксальные сочетания.'\n          }\n        ],\n        entTrap: 'Ищите логический парадокс внутри ОДНОГО образа («убогая роскошь», «живой труп»). Не путайте с антитезой — противопоставлением двух разных понятий («день и ночь», «ум и глупость»).'\n      },\n      {\n        id: 'irony',\n        title: 'Ирония',\n        category: 'Контраст и ирония',\n        badgeType: 'Базовый',\n        formula: 'Скрытая насмешка: слово или фраза употребляются в смысле, прямо противоположном буквальному.',\n        explanation: 'Внешне фраза может звучать как похвала или сочувствие, но контекст и ситуация подсказывают, что говорящий имеет в виду обратное.',\n        examples: [\n          {\n            text: 'Ну и умница же ты, раз забыл дома ключ и паспорт!',\n            highlight: 'Ну и умница же ты',\n            note: 'Похвала «умница» означает упрёк в рассеянности.'\n          },\n          {\n            text: '«Отколе, умная, бредёшь ты, голова?» — спрашивает Лисица Осла (И. А. Крылов, «Лисица и Осёл»).',\n            highlight: 'умная, бредёшь ты, голова',\n            note: 'Похвальное «умная голова» звучит как насмешка над глупым Ослом.'\n          }\n        ],\n        entTrap: 'Ирония vs Сарказм: ирония легче, тоньше и ближе к шутке или подтруниванию; сарказм — злой, едкий и беспощадный.'\n      },\n      {\n        id: 'sarcasm',\n        title: 'Сарказм',\n        category: 'Контраст и ирония',\n        badgeType: 'Смежный',\n        formula: 'Высшая степень иронии — злая, язвительная, обличительная насмешка, направленная на резкое уязвление порока.',\n        explanation: 'Если ирония улыбается, то сарказм бьёт без пощады: он обнажает лицемерие, жестокость или глупость через горькую издёвку.',\n        examples: [\n          {\n            text: '«Полу-милорд, полу-купец, полу-мудрец, полу-невежда, полу-подлец, но есть надежда, что будет полным наконец» (А. С. Пушкин, эпиграмма на М. С. Воронцова).',\n            highlight: 'полу-подлец, но есть надежда, что будет полным наконец',\n            note: 'Злая, обличающая насмешка: последняя строка превращает «полу-» в приговор.'\n          }\n        ],\n        entTrap: 'В определениях сарказм узнают по ключевым словам: «едкая, злая, язвительная насмешка».'\n      },\n      {\n        id: 'hyperbole',\n        title: 'Гипербола',\n        category: 'Контраст и ирония',\n        badgeType: 'Базовый',\n        formula: 'Намеренное художественное преувеличение размеров, силы, количества или длительности явления.',\n        explanation: 'Гипербола усиливает эмоциональное впечатление или создаёт комический, гротескный эффект (как в сатире Н. В. Гоголя).',\n        examples: [\n          {\n            text: '«...Шаровары в таких широких складках, что если бы раздуть их, то в них можно бы поместить весь двор с амбарами и строением» (Н. В. Гоголь).',\n            highlight: 'поместить весь двор с амбарами',\n            note: 'Яркое сатирическое преувеличение размеров.'\n          },\n          {\n            text: 'Слёз пролито целое море / не виделись сто лет.',\n            highlight: 'целое море / сто лет',\n            note: 'Преувеличение количества и времени.'\n          }\n        ],\n        entTrap: 'Гипербола — это всегда ПРЕУВЕЛИЧЕНИЕ (в большую сторону), а её зеркальный антипод — литота.'\n      },\n      {\n        id: 'litotes',\n        title: 'Литота',\n        category: 'Контраст и ирония',\n        badgeType: 'Ловушка ЕНТ',\n        formula: 'Намеренное художественное преуменьшение размеров, роста, силы или значения предмета.',\n        explanation: 'Литота делает образ миниатюрным, скромным или фольклорно-выразительным, акцентируя внимание на малости величины.',\n        examples: [\n          {\n            text: 'Он был ниже травы, тише воды / сам с ноготок, а борода с локоток.',\n            highlight: 'ниже травы, тише воды / с ноготок',\n            note: 'Образное преуменьшение роста или заметности.'\n          },\n          {\n            text: '«Ваш шпиц, прелестный шпиц, не более напёрстка» (А. С. Грибоедов).',\n            highlight: 'не более напёрстка',\n            note: 'Собачка преуменьшена до размеров швейного напёрстка.'\n          }\n        ],\n        entTrap: 'Частая ошибка: путать литоту и гиперболу. Запомните: «от горшка два вершка» — это преуменьшение роста, значит ЛИТОТА.'\n      }\n    ];\n\n    const CATEGORIES = [\n      'Все',\n      'Эпитеты',\n      'Сравнения',\n      'Метафора и образы',\n      'Перенос по связи',\n      'Контраст и ирония'\n    ];\n\n    const STORAGE_KEY_LEARNED = 'ent_tropes_learned_v2';\n    const STORAGE_KEY_THEME = 'ent_tropes_theme_v1';\n\n    const state = {\n      activeCategory: 'Все',\n      searchQuery: '',\n      theme: 'light', // 'light' (Книга) или 'graphite' (Графит)\n      learnedIds: new Set(),\n      expandedIds: new Set(['epithet-artistic', 'comparison-instrumental']),\n      lastSnapshotBeforeReset: null\n    };\n\n    const dom = {\n      htmlEl: document.documentElement,\n      themeLightBtn: document.getElementById('themeLightBtn'),\n      themeDarkBtn: document.getElementById('themeDarkBtn'),\n      totalCountLabel: document.getElementById('totalCountLabel'),\n      progressStats: document.getElementById('progressStats'),\n      progressBarFill: document.getElementById('progressBarFill'),\n      searchInput: document.getElementById('searchInput'),\n      clearSearchBtn: document.getElementById('clearSearchBtn'),\n      toggleAllBtn: document.getElementById('toggleAllBtn'),\n      resetProgressBtn: document.getElementById('resetProgressBtn'),\n      categoryTabs: document.getElementById('categoryTabs'),\n      visibleCountBadge: document.getElementById('visibleCountBadge'),\n      tropesList: document.getElementById('tropesList'),\n      emptyState: document.getElementById('emptyState'),\n      resetFiltersBtn: document.getElementById('resetFiltersBtn'),\n      toastBanner: document.getElementById('toastBanner'),\n      toastText: document.getElementById('toastText'),\n      toastUndoBtn: document.getElementById('toastUndoBtn')\n    };\n\n    let toastTimer = null;\n\n    /**\n     * Показывает мягкое всплывающее уведомление внизу экрана.\n     */\n    function showToast(message, { showUndo = false } = {}) {\n      dom.toastText.textContent = message;\n      dom.toastUndoBtn.classList.toggle('hidden', !showUndo);\n\n      dom.toastBanner.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');\n      dom.toastBanner.classList.add('opacity-100', 'translate-y-0');\n\n      if (toastTimer) clearTimeout(toastTimer);\n      toastTimer = setTimeout(() => {\n        dom.toastBanner.classList.remove('opacity-100', 'translate-y-0');\n        dom.toastBanner.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');\n      }, showUndo ? 5000 : 2400);\n    }\n\n    /**\n     * Применяет выбранную тему ('light' или 'graphite') и обновляет состояние кнопок.\n     */\n    function applyTheme(themeName, { persist = true } = {}) {\n      state.theme = themeName === 'graphite' ? 'graphite' : 'light';\n      dom.htmlEl.classList.toggle('theme-graphite', state.theme === 'graphite');\n\n      const isLight = state.theme === 'light';\n      dom.themeLightBtn.setAttribute('aria-pressed', String(isLight));\n      dom.themeDarkBtn.setAttribute('aria-pressed', String(!isLight));\n\n      if (isLight) {\n        dom.themeLightBtn.style.backgroundColor = 'var(--bg-card)';\n        dom.themeLightBtn.style.color = 'var(--text-primary)';\n        dom.themeLightBtn.style.boxShadow = 'var(--shadow-card)';\n        dom.themeDarkBtn.style.backgroundColor = 'transparent';\n        dom.themeDarkBtn.style.color = 'var(--text-secondary)';\n        dom.themeDarkBtn.style.boxShadow = 'none';\n      } else {\n        dom.themeDarkBtn.style.backgroundColor = 'var(--bg-card)';\n        dom.themeDarkBtn.style.color = 'var(--text-primary)';\n        dom.themeDarkBtn.style.boxShadow = 'var(--shadow-card)';\n        dom.themeLightBtn.style.backgroundColor = 'transparent';\n        dom.themeLightBtn.style.color = 'var(--text-secondary)';\n        dom.themeLightBtn.style.boxShadow = 'none';\n      }\n\n      if (persist) {\n        try {\n          localStorage.setItem(STORAGE_KEY_THEME, state.theme);\n        } catch (err) {\n          console.warn('Не удалось сохранить тему:', err);\n        }\n      }\n    }\n\n    /**\n     * Загружает прогресс и выбранную тему из localStorage.\n     */\n    function loadFromStorage() {\n      try {\n        const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);\n        if (savedTheme === 'graphite' || savedTheme === 'light') {\n          applyTheme(savedTheme, { persist: false });\n        } else {\n          applyTheme('light', { persist: false });\n        }\n      } catch (err) {\n        applyTheme('light', { persist: false });\n      }\n\n      try {\n        const raw = localStorage.getItem(STORAGE_KEY_LEARNED);\n        if (!raw) return;\n        const parsed = JSON.parse(raw);\n        if (Array.isArray(parsed)) {\n          const validIds = new Set(TROPES_DATA.map((t) => t.id));\n          state.learnedIds = new Set(parsed.filter((id) => validIds.has(id)));\n        }\n      } catch (err) {\n        console.warn('Не удалось прочитать прогресс:', err);\n      }\n    }\n\n    /**\n     * Сохраняет прогресс изучения в localStorage.\n     */\n    function saveLearnedToStorage() {\n      try {\n        localStorage.setItem(STORAGE_KEY_LEARNED, JSON.stringify(Array.from(state.learnedIds)));\n      } catch (err) {\n        console.warn('Не удалось сохранить прогресс:', err);\n      }\n    }\n\n    function escapeHtml(str) {\n      return String(str)\n        .replace(/&/g, '&amp;')\n        .replace(/<\/g, '&lt;')\n        .replace(/>/g, '&gt;')\n        .replace(/\"/g, '&quot;')\n        .replace(/'/g, '&#39;');\n    }\n\n    function escapeRegExp(str) {\n      return str.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n    }\n\n    /**\n     * Подсвечивает поисковые совпадения в тексте.\n     */\n    function highlightSearch(text, query) {\n      const safeText = String(text);\n      const trimmed = query.trim();\n      if (!trimmed) return escapeHtml(safeText);\n\n      const regex = new RegExp(`(${escapeRegExp(trimmed)})`, 'gi');\n      return safeText\n        .split(regex)\n        .map((part) =>\n          part.toLowerCase() === trimmed.toLowerCase()\n            ? `<mark class=\"search-hit\">${escapeHtml(part)}<\/mark>`\n            : escapeHtml(part)\n        )\n        .join('');\n    }\n\n    /**\n     * Оформляет текст примера с выделением ключевого фрагмента и подсветкой поиска.\n     */\n    function renderHighlightedExample(exampleText, keyPhrase, query) {\n      const safeExample = String(exampleText);\n      const safeKey = String(keyPhrase || '').trim();\n\n      if (!safeKey || !safeExample.toLowerCase().includes(safeKey.toLowerCase())) {\n        return highlightSearch(safeExample, query);\n      }\n\n      const keyRegex = new RegExp(`(${escapeRegExp(safeKey)})`, 'i');\n      const segments = safeExample.split(keyRegex);\n\n      return segments\n        .map((seg) => {\n          if (seg.toLowerCase() === safeKey.toLowerCase()) {\n            return `<span class=\"rounded px-1.5 py-0.5 font-semibold\" style=\"background-color: var(--accent-soft); color: var(--accent-primary);\">${highlightSearch(seg, query)}<\/span>`;\n          }\n          return highlightSearch(seg, query);\n        })\n        .join('');\n    }\n\n    /**\n     * Возвращает отфильтрованный список тропов.\n     */\n    function getFilteredTropes() {\n      const q = state.searchQuery.trim().toLowerCase();\n\n      return TROPES_DATA.filter((trope) => {\n        const matchesCat =\n          state.activeCategory === 'Все' || trope.category === state.activeCategory;\n        if (!matchesCat) return false;\n\n        if (!q) return true;\n\n        const corpus = [\n          trope.title,\n          trope.category,\n          trope.badgeType,\n          trope.formula,\n          trope.explanation,\n          trope.entTrap,\n          ...trope.examples.map((e) => `${e.text} ${e.highlight} ${e.note}`)\n        ]\n          .join(' ')\n          .toLowerCase();\n\n        return corpus.includes(q);\n      });\n    }\n\n    /**\n     * Обновляет счётчики и шкалу прогресса.\n     */\n    function updateProgressUI() {\n      const total = TROPES_DATA.length;\n      const learned = state.learnedIds.size;\n      const percent = total > 0 ? Math.round((learned / total) * 100) : 0;\n\n      dom.totalCountLabel.textContent = `${total} тропов в программе`;\n      dom.progressStats.textContent = `${learned} из ${total} (${percent}%)`;\n      dom.progressBarFill.style.width = `${percent}%`;\n    }\n\n    /**\n     * Отрисовывает кнопки-вкладки категорий.\n     */\n    function renderCategoryTabs() {\n      dom.categoryTabs.innerHTML = '';\n\n      CATEGORIES.forEach((cat) => {\n        const count =\n          cat === 'Все'\n            ? TROPES_DATA.length\n            : TROPES_DATA.filter((t) => t.category === cat).length;\n\n        const isActive = state.activeCategory === cat;\n        const btn = document.createElement('button');\n        btn.type = 'button';\n        btn.setAttribute('aria-pressed', String(isActive));\n        btn.className =\n          'shrink-0 inline-flex items-center gap-2 rounded-xl border px-3.5 py-2 text-xs sm:text-sm font-semibold transition active:scale-[0.99]';\n\n        if (isActive) {\n          btn.style.backgroundColor = 'var(--accent-primary)';\n          btn.style.borderColor = 'var(--accent-primary)';\n          btn.style.color = '#FFFFFF';\n        } else {\n          btn.style.backgroundColor = 'var(--bg-card)';\n          btn.style.borderColor = 'var(--border-color)';\n          btn.style.color = 'var(--text-secondary)';\n        }\n\n        btn.innerHTML = `\n          <span>${escapeHtml(cat)}<\/span>\n          <span class=\"rounded-md px-1.5 py-0.5 text-xs\" style=\"${\n            isActive\n              ? 'background-color: rgba(255,255,255,0.2); color: #FFFFFF;'\n              : 'background-color: var(--bg-subtle); color: var(--text-muted);'\n          }\">${count}<\/span>\n        `;\n\n        btn.addEventListener('click', () => {\n          state.activeCategory = cat;\n          renderCategoryTabs();\n          renderTropesList();\n        });\n\n        dom.categoryTabs.appendChild(btn);\n      });\n    }\n\n    /**\n     * Возвращает стили для тега уровня/типа вопроса («Базовый», «Тонкий», «Смежный», «Ловушка ЕНТ»).\n     */\n    function getBadgeStyle(badgeType) {\n      if (badgeType === 'Ловушка ЕНТ') {\n        return 'background-color: var(--bg-trap); color: var(--text-trap-title); border: 1px solid var(--border-trap);';\n      }\n      if (badgeType === 'Тонкий' || badgeType === 'Смежный') {\n        return 'background-color: var(--accent-soft); color: var(--accent-primary);';\n      }\n      return 'background-color: var(--bg-subtle); color: var(--text-secondary);';\n    }\n\n    /**\n     * Отрисовывает список карточек тропов.\n     */\n    function renderTropesList() {\n      const filtered = getFilteredTropes();\n      dom.visibleCountBadge.textContent = `Показано: ${filtered.length} из ${TROPES_DATA.length}`;\n\n      if (filtered.length === 0) {\n        dom.tropesList.innerHTML = '';\n        dom.emptyState.classList.remove('hidden');\n        dom.toggleAllBtn.textContent = 'Развернуть все';\n        return;\n      }\n\n      dom.emptyState.classList.add('hidden');\n\n      const allExpanded = filtered.every((t) => state.expandedIds.has(t.id));\n      dom.toggleAllBtn.textContent = allExpanded ? 'Свернуть все' : 'Развернуть все';\n\n      const fragment = document.createDocumentFragment();\n      const q = state.searchQuery;\n\n      filtered.forEach((trope) => {\n        const isLearned = state.learnedIds.has(trope.id);\n        const isOpen = state.expandedIds.has(trope.id) || Boolean(q.trim());\n\n        const card = document.createElement('article');\n        card.className = [\n          'accordion-item rounded-2xl border transition-colors',\n          isOpen ? 'is-open' : '',\n          isLearned ? 'surface-card-learned' : 'surface-card'\n        ].join(' ');\n\n        const examplesHtml = trope.examples\n          .map(\n            (ex) => `\n              <li class=\"surface-subtle rounded-xl border p-3.5\">\n                <p class=\"text-base font-medium text-main\">\n                  ${renderHighlightedExample(ex.text, ex.highlight, q)}\n                <\/p>\n                <p class=\"mt-1.5 text-sm text-sub\">\n                  ${highlightSearch(ex.note, q)}\n                <\/p>\n              <\/li>\n            `\n          )\n          .join('');\n\n        card.innerHTML = `\n          <div class=\"p-4 sm:p-5\">\n            <\!-- Шапка карточки: заголовок, теги и кнопка «Изучено» -->\n            <div class=\"flex items-start justify-between gap-3\">\n              <button\n                type=\"button\"\n                aria-expanded=\"${String(isOpen)}\"\n                class=\"accordion-trigger flex flex-1 items-start gap-3 text-left outline-none rounded-xl\"\n              >\n                <span\n                  class=\"surface-subtle mt-1 flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border text-sub\"\n                >\n                  <svg class=\"accordion-chevron h-4 w-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" viewBox=\"0 0 24 24\">\n                    <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 9l-7 7-7-7\" />\n                  <\/svg>\n                <\/span>\n\n                <div class=\"min-w-0 flex-1\">\n                  <div class=\"flex flex-wrap items-center gap-2\">\n                    <h2 class=\"text-lg sm:text-xl font-bold tracking-tight text-main\">\n                      ${highlightSearch(trope.title, q)}\n                    <\/h2>\n                    <span\n                      class=\"rounded-md px-2 py-0.5 text-xs font-semibold\"\n                      style=\"${getBadgeStyle(trope.badgeType)}\"\n                    >\n                      ${escapeHtml(trope.badgeType)}\n                    <\/span>\n                    <span class=\"rounded-md px-2 py-0.5 text-xs font-medium text-dim surface-subtle border\">\n                      ${escapeHtml(trope.category)}\n                    <\/span>\n                  <\/div>\n                <\/div>\n              <\/button>\n\n              <\!-- Кнопка отметки об изучении -->\n              <button\n                type=\"button\"\n                aria-pressed=\"${String(isLearned)}\"\n                class=\"learned-toggle shrink-0 inline-flex items-center gap-1.5 rounded-xl border px-3 py-2 text-xs sm:text-sm font-semibold transition active:scale-[0.98]\"\n                style=\"${\n                  isLearned\n                    ? 'background-color: var(--success-bg); color: var(--success-text); border-color: var(--success-border);'\n                    : 'background-color: var(--bg-subtle); color: var(--text-secondary); border-color: var(--border-color);'\n                }\"\n              >\n                <svg class=\"h-4 w-4 shrink-0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" viewBox=\"0 0 24 24\">\n                  <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 13l4 4L19 7\" />\n                <\/svg>\n                <span>${isLearned ? 'Изучено' : 'Отметить'}<\/span>\n              <\/button>\n            <\/div>\n\n            <\!-- Короткая плашка «Суть за 5 секунд» — всегда на виду -->\n            <div\n              class=\"mt-3.5 rounded-xl border px-3.5 py-3\"\n              style=\"background-color: var(--bg-formula); border-color: var(--border-formula);\"\n            >\n              <span\n                class=\"block text-xs font-bold uppercase tracking-wider\"\n                style=\"color: var(--text-formula);\"\n              >\n                Суть за 5 секунд\n              <\/span>\n              <p class=\"mt-1 text-sm sm:text-base font-medium text-main\">\n                ${highlightSearch(trope.formula, q)}\n              <\/p>\n            <\/div>\n          <\/div>\n\n          <\!-- Раскрывающаяся подробная часть карточки -->\n          <div class=\"accordion-content\">\n            <div class=\"accordion-inner\">\n              <div class=\"space-y-4 border-t px-4 pb-5 pt-4 sm:px-5\" style=\"border-color: var(--border-color);\">\n                <\!-- Подробное объяснение -->\n                <div>\n                  <h3 class=\"text-xs font-bold uppercase tracking-wider text-dim\">\n                    Почему и как это работает\n                  <\/h3>\n                  <p class=\"mt-1.5 text-sm sm:text-base text-sub\">\n                    ${highlightSearch(trope.explanation, q)}\n                  <\/p>\n                <\/div>\n\n                <\!-- Блок с примерами -->\n                <div>\n                  <h3 class=\"text-xs font-bold uppercase tracking-wider text-dim\">\n                    Литературные и тестовые примеры\n                  <\/h3>\n                  <ul class=\"mt-2 space-y-2.5\">\n                    ${examplesHtml}\n                  <\/ul>\n                <\/div>\n\n                <\!-- Контрастная плашка «Как не перепутать на ЕНТ» -->\n                <div\n                  class=\"rounded-xl border p-4\"\n                  style=\"background-color: var(--bg-trap); border-color: var(--border-trap);\"\n                >\n                  <div class=\"flex items-center gap-2\">\n                    <svg\n                      class=\"h-4 w-4 shrink-0\"\n                      style=\"color: var(--text-trap-title);\"\n                      fill=\"none\"\n                      stroke=\"currentColor\"\n                      stroke-width=\"2.2\"\n                      viewBox=\"0 0 24 24\"\n                    >\n                      <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z\" />\n                    <\/svg>\n                    <h3\n                      class=\"text-xs font-bold uppercase tracking-wider\"\n                      style=\"color: var(--text-trap-title);\"\n                    >\n                      Как не перепутать на ЕНТ\n                    <\/h3>\n                  <\/div>\n                  <p\n                    class=\"mt-1.5 text-sm sm:text-base\"\n                    style=\"color: var(--text-trap-body);\"\n                  >\n                    ${highlightSearch(trope.entTrap, q)}\n                  <\/p>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n        `;\n\n        const triggerBtn = card.querySelector('.accordion-trigger');\n        triggerBtn.addEventListener('click', () => {\n          if (state.expandedIds.has(trope.id)) {\n            state.expandedIds.delete(trope.id);\n          } else {\n            state.expandedIds.add(trope.id);\n          }\n          renderTropesList();\n        });\n\n        const learnedBtn = card.querySelector('.learned-toggle');\n        learnedBtn.addEventListener('click', (e) => {\n          e.stopPropagation();\n          if (state.learnedIds.has(trope.id)) {\n            state.learnedIds.delete(trope.id);\n          } else {\n            state.learnedIds.add(trope.id);\n          }\n          saveLearnedToStorage();\n          updateProgressUI();\n          renderTropesList();\n        });\n\n        fragment.appendChild(card);\n      });\n\n      dom.tropesList.innerHTML = '';\n      dom.tropesList.appendChild(fragment);\n    }\n\n    /**\n     * Подключает все обработчики событий.\n     */\n    function bindEvents() {\n      dom.themeLightBtn.addEventListener('click', () => applyTheme('light'));\n      dom.themeDarkBtn.addEventListener('click', () => applyTheme('graphite'));\n\n      dom.searchInput.addEventListener('input', (e) => {\n        state.searchQuery = e.target.value;\n        dom.c o.onclick=e=>{const t=e.target.closest("button");if(!t)return;if(t.dataset.x!==undefined){o.hidden=true;document.body.style.overflow=""}else if(t.dataset.m!==undefined){m=+t.dataset.m;d()}};d()}

if(kd=="f")return go("Финальный пробник",finalQ(),80);
if(kd[0]=="c"){const xs=WK.filter(y=>y.t&&(S.st[y.id]||0)>=2);if(!xs.length)return alert("Отметь хотя бы одно произведение как «Прочитал».");return go("Накопительный экзамен",choose(cands(xs),+kd.slice(1)||20,false),0)}

const t=TX.find(t=>!S.seen[t.k+":0"]);if(!t)return alert("Все тексты пройдены, новые появятся в обновлениях.");go("Работа с текстом",t.q.map((q,i)=>mk(t.k+":"+i,q[0],q[1],t.f+"\n\n"+q[2],q[3],q[4],q[5])),0)}
function exams(){const nx=WK.filter(y=>y.t&&(S.st[y.id]||0)>=2).length,sl=(id,a)=>`<select id="${id}" class="sel">${a.map(([v,t])=>`<option value="${v}">${t}</option>`).join("")}</select>`,b=(d,t,x)=>`<button class="btn" data-ex="${d}" type="button"${x?" disabled":""}>${t}</button>`,cd=(h,p,body)=>`<section class="card pad"><h2>${h}</h2><p class="mu">${p}</p>${body}</section>`,

return cd("Финальный пробник","40 заданий как в спецификации: 25 + 5 + 5 + 5, 80 минут. Вопросы каждый раз новые.",b("f","Начать"))+cd("Накопительный экзамен","Повторение всего пройденного. Вопросы берутся только по произведениям со статусом «Прочитал» или «Разобрал». Сейчас доступно произведений: "+nx+(nx?"":". Отметь хотя бы одно как «Прочитал»")+". Чем больше прочитано, тем шире охват.",b("c10","10 вопросов",!nx)+" "+b("c20","20 вопросов",!nx)+" "+b("c30","30 вопросов",!nx))+cd("По автору","Пушкин, Гоголь и другие: до 15 вопросов по всем его произведениям из списка.",sl("sau",au)+b("au","Начать"))+cd("По теме","Тема из спецификации, до 15 вопросов.",sl("stp",tp)+b("tp","Начать"))+cd("По произведению","8 вопросов, отличных от теста допуска.",sl("swk",WK.filter(y=>y.t).map(y=>[y.id,y.t+" — "+y.au]))+b("wk","Начать"))+cd("Работа с текстом","Фрагмент и вопросы по нему: приёмы, тема, род.",b("tx","Начать"))+
`<section class="card pad"><h2>Результаты</h2>${S.hist.length?S.hist.map(x=>`<div class="hr"><span>${new Date(x.d).toLocaleDateString("ru-RU")} · ${x.t}<br><span class="mu">A ${x.lv.A[0]}/${x.lv.A[1]} · B ${x.lv.B[0]}/${x.lv.B[1]} · C ${x.lv.C[0]}/${x.lv.C[1]}</span></span><b>${x.ok}/${x.n}</b></div>`).join(""):'<p class="mu">Пока пусто.</p>'}</section>`}

$$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab==tab));const th=tab=="tropes",fr=th&&S.sub=="ref";$("#sb").hidden=!th;$$("#sb button").forEach(b=>b.classList.toggle("on",b.dataset.sub==S.sub));
